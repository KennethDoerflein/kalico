[respond]

# ----------------------------------------------------------------------
# Utilities
# ----------------------------------------------------------------------
[gcode_macro STATUS_MSG]
gcode:
  {% set MESSAGE = params.MSG|default('')|string %}
  {% set TYPE = params.TYPE|default('echo')|string %}
  {% set PREFIX = params.PREFIX|default('')|string %}
  {% set DISPLAY = params.DISPLAY|default('yes')|lower in ['yes', 'true', '1'] %}
  {% if DISPLAY %}
    M117 {MESSAGE}
  {% endif %}
  {% if TYPE == "error" %}
    RESPOND TYPE=error MSG="{MESSAGE}"
  {% else %}
    RESPOND PREFIX="{PREFIX}" MSG="{MESSAGE}"
  {% endif %}

[gcode_macro HOME_IF_NEEDED]
description: Homes axes when needed. Usage: HOME_IF_NEEDED [AXIS=<x|y|z|xy|xyz|etc>]
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set axis = params.AXIS|default("xyz")|lower %}

  {% set needs_x = "x" in axis and "x" not in homed %}
  {% set needs_y = "y" in axis and "y" not in homed %}
  {% set needs_z = "z" in axis and "z" not in homed %}

  {% if needs_z %}
    G28 Z
  {% elif needs_x or needs_y %}
    G28 X Y
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIG
gcode:
  SAVE_MOTION_LIMITS NAME=_bed_mesh_calibrate_limits INCLUDE_GCODE=1
  SET_VELOCITY_LIMIT VELOCITY=800 SQUARE_CORNER_VELOCITY=5 ACCEL=8000 ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE_ORIG {rawparams}
  RESTORE_MOTION_LIMITS NAME=_bed_mesh_calibrate_limits INCLUDE_GCODE=1 MOVE=0

# ----------------------------------------------------------------------
# Pause / Resume / Cancel / End print
# ----------------------------------------------------------------------
[gcode_macro _PAUSE_CONTEXT]
description: Saved user cooling state for RESUME.
variable_part_cooling: 0.0
variable_aux_fans: 0.0
gcode:

[gcode_macro _PAUSE_Z_MOVE]
description: Move Z +25mm and clamps so the final Z never exceeds 350.
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set lift = params.LIFT|default(25.0)|float %}
  {% if current_z + lift > 350.0 %}
    {% set lift = 350.0 - current_z %}
  {% endif %}
  {% if lift < 0 %}
    {% set lift = 0 %}
  {% endif %}
  {% if lift > 0 %}
    SAVE_GCODE_STATE NAME=PAUSE_Z_MOVE_STATE
    G91
    G1 Z{lift} F1000
    RESTORE_GCODE_STATE NAME=PAUSE_Z_MOVE_STATE
  {% endif %}

[gcode_macro _END_PRINT_Z_MOVE]
description: Start from current Z + 50, floor that at 100, cap it at 350, and only move upward.
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set target_z = current_z + 50.0 %}
  {% if target_z < 100.0 %}
    {% set target_z = 100.0 %}
  {% endif %}
  {% if target_z > 350.0 %}
    {% set target_z = 350.0 %}
  {% endif %}
  {% if target_z > current_z %}
    SAVE_GCODE_STATE NAME=END_PRINT_Z_MOVE_STATE
    G90
    G1 Z{target_z} F1800
    RESTORE_GCODE_STATE NAME=END_PRINT_Z_MOVE_STATE
  {% endif %}

[gcode_macro _RETRACT_WIPE]
description: Retract while wiping 2mm toward the bed center.
gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% set retract = params.RETRACT|default(3.0)|float %}
    {% set wipe = params.WIPE|default(2.0)|float %}
    {% set pos = printer.toolhead.position %}
    {% set min = printer.toolhead.axis_minimum %}
    {% set max = printer.toolhead.axis_maximum %}
    {% set wipe_x = wipe if pos.x < (min.x + max.x) / 2.0 else -wipe %}
    {% set wipe_y = wipe if pos.y < (min.y + max.y) / 2.0 else -wipe %}
    SAVE_GCODE_STATE NAME=RETRACT_WIPE_STATE
    G91
    M83
    G1 X{wipe_x} Y{wipe_y} E-{retract} F1800
    RESTORE_GCODE_STATE NAME=RETRACT_WIPE_STATE
  {% else %}
    RESPOND TYPE=error MSG="Skipping retract/wipe: extruder below minimum extrusion temperature"
  {% endif %}

[gcode_macro PAUSE]
description: Save resume state, call PAUSE_BASE, drop nozzle target to 140C, retract/wipe, lift, clean, and park at the wastebin, then shut off user cooling.
rename_existing: PAUSE_BASE
gcode:
  {% set already_paused = printer.pause_resume.is_paused|lower == 'true' %}
  {% if not already_paused %}
    _BOX_PAUSE_CAPTURE
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=part_cooling VALUE={printer.fan.speed|float}
    SET_GCODE_VARIABLE MACRO=_PAUSE_CONTEXT VARIABLE=aux_fans VALUE={printer["fan_generic aux_fans"].speed|float}
    PAUSE_BASE
    M400
    {% if not params.SKIP_RETRACT_WIPE|default(0)|int %}
      _RETRACT_WIPE
    {% endif %}
    M104 S140
    _PAUSE_Z_MOVE
    NOZZLE_CLEAN
    M107
  {% endif %}

[gcode_macro RESUME]
description: Recover interrupted Box work, heat and prime at the wastebin, restore user cooling, then return to the print.
rename_existing: RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused|lower == 'true' %}
    {% set part_cooling = printer["gcode_macro _PAUSE_CONTEXT"].part_cooling|float %}
    {% set aux_fans = printer["gcode_macro _PAUSE_CONTEXT"].aux_fans|float %}
    REQUIRE_EXTRUDER_CLEAR
    _BOX_RESUME_PREPARE
    REQUIRE_EXTRUDER_CLEAR
    M106 S{(part_cooling * 255.0 + 0.5)|int}
    SET_FAN_SPEED FAN=aux_fans SPEED={aux_fans}
    {% if 'VELOCITY' in params %}
      RESUME_BASE VELOCITY={params.VELOCITY}
    {% else %}
      RESUME_BASE
    {% endif %}
    _BOX_RESUME_COMMIT
  {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  END_PRINT
  CANCEL_POWER_OFF

[gcode_macro _RESET_PRINT_STATE]
description: Restore the terminal/new-print thermal, fan, motion, and G-code baseline.
gcode:
  TURN_OFF_HEATERS
  M107
  M141 S0
  M107 P3

  CLEAR_PAUSE
  RESET_VELOCITY_LIMIT
  G90
  M83
  M220 S100
  M221 S100

[gcode_macro END_PRINT]
description: Retract if hot enough, turn heaters and user cooling off, move Z with _END_PRINT_Z_MOVE, then park at the waste bin.
gcode:
  _RETRACT_WIPE
  M400
  _RESET_PRINT_STATE
  _END_PRINT_Z_MOVE
  BOX_GO_TO_WASTEBIN
  {% if printer.box.unload_after_print_enabled|default(false) %}
    UPDATE_DELAYED_GCODE ID=_BOX_UNLOAD_AFTER_PRINT DURATION=1
  {% endif %}
  {% if printer["gcode_macro _AUTO_POWER_OFF_VARS"].auto_off|default(false) %}
    WAIT_FOR_COOLDOWN_AND_POWER_OFF DELAY={printer["gcode_macro _AUTO_POWER_OFF_VARS"].initial_delay|default(30)}
  {% endif %}

[delayed_gcode _BOX_UNLOAD_AFTER_PRINT]
gcode:
  {% if printer.print_stats.state == "complete" %}
    BOX_UNLOAD
  {% endif %}

# ----------------------------------------------------------------------
# M-code overrides
# ----------------------------------------------------------------------
[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% set fan = params.P|default(0)|int %}
  {% set speed = params.S|default(255)|float %}
  {% set normalized_speed = [0.0, [speed / 255.0, 1.0]|min]|max %}
  {% if fan == 0 %}
    M106.1 S{speed}
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED={normalized_speed}
  {% elif fan == 3 %}
    SET_TEMPERATURE_FAN_MANUAL_SPEED TEMPERATURE_FAN=chamber_exhaust_fans SPEED={normalized_speed}
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M106 P{fan}. Use P0 for part cooling, P2 for aux_fans, or P3 for chamber exhaust filtration."
  {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
  {% set fan = params.P|default(-1)|int %}
  {% if fan == -1 %}
    M107.1
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 0 %}
    M107.1
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 3 %}
    SET_TEMPERATURE_FAN_MANUAL_SPEED TEMPERATURE_FAN=chamber_exhaust_fans SPEED=0
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M107 P{fan}. Use P0 for part cooling, P2 for aux_fans, or P3 for chamber exhaust filtration."
  {% endif %}

[gcode_macro M141]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    {% if chamber_temp > 40 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chamber_temp}
    {% elif chamber_temp > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={chamber_temp}
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
  {% endif %}

[gcode_macro M191]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    {% if chamber_temp > 40 and printer.print_stats.state == "printing" %}
      RESPOND TYPE=echo MSG="M191 is waiting for chamber heat during an active print. It appears \"Activate temperature control\" is enabled in Orca Slicer. Disable it before slicing to get rid of this warning."
    {% endif %}
    M141 S{chamber_temp}
    {% if chamber_temp > 40 %}
      {% set max_delta = printer["configfile"]["config"]["heater_generic chamber_heater"].max_delta|float %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={chamber_temp - max_delta}
    {% elif chamber_temp > 0 %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MAXIMUM={chamber_temp}
    {% endif %}
  {% endif %}

# ----------------------------------------------------------------------
# Maintenance
# ----------------------------------------------------------------------
[gcode_macro LUBRICATE_RAILS]
gcode:
  {% set ITERATIONS = params.ITERATIONS|default(1)|int %}
  {% set SPEED_MM_S = params.SPEED|default(500)|float %}
  {% set SPEED_MM_MIN = SPEED_MM_S * 60 %}

  HOME_IF_NEEDED
  G1 Z10 F3000

  {% for i in range(ITERATIONS) %}
    STATUS_MSG MSG="Lubricating rails, iteration {i + 1} of {ITERATIONS}..."
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X350 Y350 Z10 F{SPEED_MM_MIN}
    G1 X0 Y350 Z10 F{SPEED_MM_MIN}
    G1 X350 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z350 F3000
    G1 X350 Y350 Z10 F3000
    G1 X350 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y350 Z10 F{SPEED_MM_MIN}
    G1 X350 Y350 Z10 F{SPEED_MM_MIN}
  {% endfor %}

[gcode_macro BELT_TENSION]
gcode:
  G90
  BED_MESH_CLEAR
  {% set axes = params.AXES|default("XY")|upper %}
  {% if 'X' in axes %}
    BELT_TENSION_SET AXIS=X TENSION=140
  {% endif %}
  {% if 'Y' in axes %}
    BELT_TENSION_SET AXIS=Y TENSION=140
  {% endif %}

# ----------------------------------------------------------------------
# PID calibration
# ----------------------------------------------------------------------
[gcode_macro BEDPID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  SAVE_CONFIG

[gcode_macro NOZZLE_PID]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=230
  SAVE_CONFIG
  M107

[gcode_macro NOZZLE_PID_HIGH]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=320
  SAVE_CONFIG
  M107

# ----------------------------------------------------------------------
# Tasmota Power Off & Cooldown Management
# ----------------------------------------------------------------------
[gcode_macro _AUTO_POWER_OFF_VARS]
description: Configuration variables for automatic power-off via Tasmota plug
variable_auto_off: True         # Whether auto power-off runs after END_PRINT
variable_device: "tasmota_plug" # Moonraker [power <name>] device
variable_cool_temp: 50.0        # Nozzle cooldown threshold before shutting off (deg C)
variable_initial_delay: 30      # Initial delay before checking cooldown after print (seconds)
variable_check_interval: 10     # Interval between cooldown checks (seconds)
gcode:

[gcode_macro SET_AUTO_POWER_OFF]
description: Enable or disable automatic power-off after print. Usage: SET_AUTO_POWER_OFF [ENABLE=1|0]
gcode:
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  SET_GCODE_VARIABLE MACRO=_AUTO_POWER_OFF_VARS VARIABLE=auto_off VALUE={enable}
  {% if enable %}
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Auto-power-off after print ENABLED"
  {% else %}
    CANCEL_POWER_OFF
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Auto-power-off after print DISABLED"
  {% endif %}

[gcode_macro CANCEL_POWER_OFF]
description: Cancel any scheduled or pending auto-power-off
gcode:
  UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION=0
  STATUS_MSG PREFIX="[Auto-Off]:" MSG="Scheduled power-off cancelled"

[gcode_macro WAIT_FOR_COOLDOWN_AND_POWER_OFF]
description: Check if idle, wait for hotend to cool below threshold, then power off via Tasmota plug
gcode:
  {% set vars = printer["gcode_macro _AUTO_POWER_OFF_VARS"] %}
  {% set delay = params.DELAY|default(vars.initial_delay)|int %}
  {% set device = params.DEVICE|default(vars.device)|string %}
  {% set cool_temp = params.COOL_TEMP|default(vars.cool_temp)|float %}

  # Check if printer is currently printing, paused, or heating
  {% set is_printing = printer.print_stats.state in ['printing', 'paused'] %}
  {% set is_heating = (printer.extruder.target > 0) or (printer.heater_bed.target > 0) %}
  {% if is_printing or is_heating %}
    STATUS_MSG TYPE=error PREFIX="[Auto-Off]:" MSG="Cannot schedule power-off: Printer is not idle (state: {printer.print_stats.state}, extruder target: {printer.extruder.target}C, bed target: {printer.heater_bed.target}C)!"
  {% else %}
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Auto-power-off armed. Waiting {delay}s, then checking until hotend <= {cool_temp}C..."
    UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION={delay}
  {% endif %}

[delayed_gcode _POWER_OFF_COOLDOWN_CHECK]
gcode:
  {% set vars = printer["gcode_macro _AUTO_POWER_OFF_VARS"] %}
  {% set device = vars.device|string %}
  {% set cool_temp = vars.cool_temp|float %}
  {% set check_interval = vars.check_interval|int %}

  # Verification of idle state
  {% set is_printing = printer.print_stats.state in ['printing', 'paused'] %}
  {% set is_active_motion = printer.idle_timeout.state == 'Printing' %}
  {% set is_heating = (printer.extruder.target > 0) or (printer.heater_bed.target > 0) %}

  {% if is_printing or is_active_motion or is_heating %}
    # Abort power off immediately if printer is not idle
    UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION=0
    STATUS_MSG TYPE=error PREFIX="[Auto-Off]:" MSG="Power-off ABORTED: Printer is not idle (print_stats: {printer.print_stats.state}, idle_timeout: {printer.idle_timeout.state}, nozzle target: {printer.extruder.target}C, bed target: {printer.heater_bed.target}C)!"
  {% elif printer.extruder.temperature > cool_temp %}
    # Still cooling down: reschedule next check
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Cooling hotend: {printer.extruder.temperature|round(1)}C (target <= {cool_temp}C). Rechecking in {check_interval}s..."
    UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION={check_interval}
  {% else %}
    # Hotend is cool and printer is idle: turn off device
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Hotend is cool ({printer.extruder.temperature|round(1)}C <= {cool_temp}C) and printer is idle. Turning off {device}..."
    {action_call_remote_method("set_device_power", device=device, state="off")}
  {% endif %}

[gcode_macro POWER_OFF_PRINTER]
description: Immediately turn off the Tasmota plug if printer is idle and cool. Usage: POWER_OFF_PRINTER [DEVICE=<name>] [FORCE=1]
gcode:
  {% set force = params.FORCE|default(0)|int %}
  {% set vars = printer["gcode_macro _AUTO_POWER_OFF_VARS"] %}
  {% set device = params.DEVICE|default(vars.device)|string %}
  {% set cool_temp = vars.cool_temp|float %}

  {% set is_printing = printer.print_stats.state in ['printing', 'paused'] %}
  {% set is_active_motion = printer.idle_timeout.state == 'Printing' %}
  {% set is_heating = (printer.extruder.target > 0) or (printer.heater_bed.target > 0) %}

  {% if not force and (is_printing or is_active_motion or is_heating) %}
    STATUS_MSG TYPE=error PREFIX="[Power]:" MSG="Power-off aborted: Printer is not idle! Use FORCE=1 to override."
  {% elif not force and printer.extruder.temperature > cool_temp %}
    STATUS_MSG TYPE=error PREFIX="[Power]:" MSG="Power-off aborted: Hotend is still hot ({printer.extruder.temperature|round(1)}C > {cool_temp}C)! Use WAIT_FOR_COOLDOWN_AND_POWER_OFF or FORCE=1."
  {% else %}
    STATUS_MSG PREFIX="[Power]:" MSG="Turning off {device}..."
    {action_call_remote_method("set_device_power", device=device, state="off")}
  {% endif %}
