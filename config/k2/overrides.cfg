[box]
box_count: 1 # Set to actual CFS count for faster startup.

[heat_soak]

[z_tilt]
points:
    20,175
    330,175
speed: 200
horizontal_move_z: 8
retries: 10
retry_tolerance: 0.05

[prtouch]
register_as_probe: True

[gcode_macro SKIP_SOAK]
description: Skip active heat soak countdown during print start
gcode:
  _HEAT_SOAK_SKIP

[gcode_macro M191]
rename_existing: M191.1
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    M141 S{chamber_temp}
    {% if printer.print_stats.state == "printing" %}
      RESPOND TYPE=error MSG="M191 called during an active print. It appears \"Activate temperature control\" is enabled in Orca Slicer. Disable it before slicing. Skipping chamber wait to prevent print damage."
    {% else %}
      {% if chamber_temp > 40 %}
        {% set max_delta = printer["configfile"]["config"]["heater_generic chamber_heater"].max_delta|float %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={chamber_temp - max_delta}
      {% elif chamber_temp > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MAXIMUM={chamber_temp}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _START_PRINT_VARS]
# Heat Soak times (minutes)
variable_heat_soak: 12         # Default fallback soak time
variable_soak_pla: 12          # 12 min for PLA
variable_soak_petg: 5          # 5 min for PETG
variable_soak_asa: 30          # 30 min for ASA
variable_soak_abs: 30          # 30 min for ABS

# Z-Offsets per material (mm)
variable_offset_default: 0.00
variable_offset_asa: 0.00
variable_offset_abs: 0.00

# Pressure Advance per material
variable_pa_default: 0.04
variable_pa_pla: 0.04
variable_pa_petg: 0.05
variable_pa_abs: 0.035
variable_pa_asa: 0.035
variable_pa_tpu: 0.3

# Flow Multiplier (%) per material
variable_flow_default: 100
variable_flow_pla: 100
variable_flow_petg: 95
variable_flow_abs: 100
variable_flow_asa: 100

variable_adaptive_axis_twist_comp: 0 # Calibrate twist over the print area unless PRTouch is the probe. 0 disables.
variable_prtouch_scrub: 1 # Scrub the nozzle on the plate tab when PRTouch exists. 0 skips scrub only.
gcode:
