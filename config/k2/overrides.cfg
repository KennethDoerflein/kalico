[box]
box_count: 1 # Set to actual CFS count for faster startup.

[z_tilt]
points:
    20,175
    330,175
speed: 200
horizontal_move_z: 8
retries: 10
retry_tolerance: 0.05

[prtouch]
register_as_probe: True

# ----------------------------------------------------------------------
# M-code overrides
# ----------------------------------------------------------------------
[gcode_macro M191]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    M141 S{chamber_temp}
    {% if printer.print_stats.state == "printing" %}
      RESPOND TYPE=error MSG="M191 called during an active print. It appears \"Activate temperature control\" is enabled in Orca Slicer. Disable it before slicing. Skipping chamber wait to prevent print damage."
    {% else %}
      {% if chamber_temp > 40 %}
        {% set max_delta = printer["configfile"]["config"]["heater_generic chamber_heater"].max_delta|float %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={chamber_temp - max_delta}
      {% elif chamber_temp > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MAXIMUM={chamber_temp}
      {% endif %}
    {% endif %}
  {% endif %}

# ----------------------------------------------------------------------
# Print Lifecycle Overrides (keeps upstream macros.cfg clean for auto merge)
# ----------------------------------------------------------------------
[gcode_macro CANCEL_PRINT]
rename_existing: _BASE_CANCEL_PRINT
description: Cancel current print and park toolhead, unloading box filament if configured. Usage: CANCEL_PRINT [UNLOAD=1|0]
gcode:
  _BASE_CANCEL_PRINT {rawparams}
  {% set default_unload = printer["gcode_macro _CANCEL_PRINT_VARS"].unload_box|default(true) %}
  {% set should_unload = (params.UNLOAD|default(default_unload)|string|lower in ['true', '1', 'yes']) if params.UNLOAD is defined else default_unload %}
  {% if 'box' in printer %}
    {% if should_unload %}
      UPDATE_DELAYED_GCODE ID=_BOX_UNLOAD_AFTER_PRINT DURATION=1
    {% else %}
      UPDATE_DELAYED_GCODE ID=_BOX_UNLOAD_AFTER_PRINT DURATION=0
    {% endif %}
  {% endif %}

[gcode_macro END_PRINT]
description: Retract if hot enough, turn heaters and user cooling off, move Z with _END_PRINT_Z_MOVE, then park at the waste bin.
gcode:
  _RETRACT_WIPE
  M400
  _RESET_PRINT_STATE
  _END_PRINT_Z_MOVE
  BOX_GO_TO_WASTEBIN
  {% if printer.box.unload_after_print_enabled|default(false) %}
    UPDATE_DELAYED_GCODE ID=_BOX_UNLOAD_AFTER_PRINT DURATION=1
  {% endif %}
  {% if printer.print_stats.state == "cancelled" %}
    CANCEL_POWER_OFF
  {% elif printer["gcode_macro _AUTO_POWER_OFF_VARS"].auto_off|default(false) %}
    WAIT_FOR_COOLDOWN_AND_POWER_OFF DELAY={printer["gcode_macro _AUTO_POWER_OFF_VARS"].initial_delay|default(60)}
  {% endif %}

# ----------------------------------------------------------------------
# Tasmota Power Off & Cooldown Management
# ----------------------------------------------------------------------
[gcode_macro _AUTO_POWER_OFF_VARS]
description: Configuration variables for automatic power-off via Tasmota plug
variable_auto_off: True         # Whether auto power-off runs after END_PRINT
variable_device: "tasmota_plug" # Moonraker [power <name>] device
variable_cool_temp: 65.0        # Nozzle cooldown threshold before shutting off (deg C)
variable_initial_delay: 60      # Initial delay before checking cooldown after print (seconds)
variable_check_interval: 10     # Interval between cooldown checks (seconds)
gcode:

[gcode_macro SET_AUTO_POWER_OFF]
description: Enable or disable automatic power-off after print. Usage: SET_AUTO_POWER_OFF [ENABLE=1|0]
gcode:
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  SET_GCODE_VARIABLE MACRO=_AUTO_POWER_OFF_VARS VARIABLE=auto_off VALUE={enable}
  {% if enable %}
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Auto-power-off after print ENABLED"
  {% else %}
    CANCEL_POWER_OFF
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Auto-power-off after print DISABLED"
  {% endif %}

[gcode_macro CANCEL_POWER_OFF]
description: Cancel any scheduled or pending auto-power-off
gcode:
  UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION=0
  STATUS_MSG PREFIX="[Auto-Off]:" MSG="Scheduled power-off cancelled"

[gcode_macro WAIT_FOR_COOLDOWN_AND_POWER_OFF]
description: Arm auto-power-off routine after cooldown once printer is idle
gcode:
  {% set vars = printer["gcode_macro _AUTO_POWER_OFF_VARS"] %}
  {% set delay = params.DELAY|default(vars.initial_delay)|int %}
  {% set cool_temp = params.COOL_TEMP|default(vars.cool_temp)|float %}

  STATUS_MSG PREFIX="[Auto-Off]:" MSG="Auto-power-off armed. Waiting {delay}s for post-print completion, then monitoring cooldown (target < {cool_temp}C)..."
  UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION={delay}

[delayed_gcode _POWER_OFF_COOLDOWN_CHECK]
gcode:
  {% set vars = printer["gcode_macro _AUTO_POWER_OFF_VARS"] %}
  {% set device = vars.device|string %}
  {% set cool_temp = vars.cool_temp|float %}
  {% set check_interval = vars.check_interval|int %}

  # Verification of idle state (ignoring bed temp)
  {% set is_printing = printer.print_stats.state in ['printing', 'paused'] %}
  {% set is_active_motion = printer.idle_timeout.state == 'Printing' %}
  {% set is_heating = printer.extruder.target > 0 %}

  {% if is_printing or is_active_motion or is_heating %}
    # Abort power off immediately if printer is not idle
    UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION=0
    STATUS_MSG TYPE=error PREFIX="[Auto-Off]:" MSG="Power-off ABORTED: Printer is not idle (print_stats: {printer.print_stats.state}, idle_timeout: {printer.idle_timeout.state}, nozzle target: {printer.extruder.target}C)!"
  {% elif printer.extruder.temperature >= cool_temp %}
    # Still cooling down: reschedule next check
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Cooling hotend: {printer.extruder.temperature|round(1)}C (target < {cool_temp}C). Rechecking in {check_interval}s..."
    UPDATE_DELAYED_GCODE ID=_POWER_OFF_COOLDOWN_CHECK DURATION={check_interval}
  {% else %}
    # Hotend is cool and printer is idle: turn off device
    STATUS_MSG PREFIX="[Auto-Off]:" MSG="Hotend is cool ({printer.extruder.temperature|round(1)}C < {cool_temp}C) and printer is idle. Turning off {device}..."
    {action_call_remote_method("set_device_power", device=device, state="off")}
  {% endif %}

[gcode_macro POWER_OFF_PRINTER]
description: Immediately turn off the Tasmota plug if printer is idle and cool. Usage: POWER_OFF_PRINTER [DEVICE=<name>] [FORCE=1]
gcode:
  {% set force = params.FORCE|default(0)|int %}
  {% set vars = printer["gcode_macro _AUTO_POWER_OFF_VARS"] %}
  {% set device = params.DEVICE|default(vars.device)|string %}
  {% set cool_temp = vars.cool_temp|float %}

  {% set is_printing = printer.print_stats.state in ['printing', 'paused'] %}
  {% set is_active_motion = printer.idle_timeout.state == 'Printing' %}
  {% set is_heating = printer.extruder.target > 0 %}

  {% if not force and (is_printing or is_active_motion or is_heating) %}
    STATUS_MSG TYPE=error PREFIX="[Power]:" MSG="Power-off aborted: Printer is not idle! Use FORCE=1 to override."
  {% elif not force and printer.extruder.temperature >= cool_temp %}
    STATUS_MSG TYPE=error PREFIX="[Power]:" MSG="Power-off aborted: Hotend is still hot ({printer.extruder.temperature|round(1)}C >= {cool_temp}C)! Use WAIT_FOR_COOLDOWN_AND_POWER_OFF or FORCE=1."
  {% else %}
    STATUS_MSG PREFIX="[Power]:" MSG="Turning off {device}..."
    {action_call_remote_method("set_device_power", device=device, state="off")}
  {% endif %}

# ----------------------------------------------------------------------
# Material & Calibration Overrides
# ----------------------------------------------------------------------
[gcode_macro _START_PRINT_VARS]
# Heat Soak times (minutes)
variable_heat_soak: 12         # Default fallback soak time
variable_soak_pla: 12          # 12 min for PLA
variable_soak_petg: 5          # 5 min for PETG
variable_soak_asa: 30          # 30 min for ASA
variable_soak_abs: 30          # 30 min for ABS

# Z-Offsets per material (mm)
variable_offset_default: 0.00
variable_offset_asa: 0.00
variable_offset_abs: 0.00

# Pressure Advance per material
variable_pa_default: 0.04
variable_pa_pla: 0.04
variable_pa_petg: 0.05
variable_pa_abs: 0.035
variable_pa_asa: 0.035
variable_pa_tpu: 0.3

# Flow Multiplier (%) per material
variable_flow_default: 100
variable_flow_pla: 100
variable_flow_petg: 95
variable_flow_abs: 100
variable_flow_asa: 100

variable_adaptive_axis_twist_comp: 0 # Calibrate twist over the print area unless PRTouch is the probe. 0 disables.
variable_prtouch_scrub: 1 # Scrub the nozzle on the plate tab when PRTouch exists. 0 skips scrub only.
gcode:

# ----------------------------------------------------------------------
# Cancel Print & Box Unload Overrides
# ----------------------------------------------------------------------
[gcode_macro _CANCEL_PRINT_VARS]
description: Configuration variables for CANCEL_PRINT
variable_unload_box: True       # Unload CFS filament on print cancel (set to False to disable)
gcode:

[gcode_macro SET_CANCEL_UNLOAD]
description: Enable or disable automatic box unload on print cancel. Usage: SET_CANCEL_UNLOAD [ENABLE=1|0]
gcode:
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  SET_GCODE_VARIABLE MACRO=_CANCEL_PRINT_VARS VARIABLE=unload_box VALUE={enable}
  {% if enable %}
    STATUS_MSG PREFIX="[Box]:" MSG="Box unload on print cancel ENABLED"
  {% else %}
    STATUS_MSG PREFIX="[Box]:" MSG="Box unload on print cancel DISABLED"
  {% endif %}

[delayed_gcode _BOX_UNLOAD_AFTER_PRINT]
gcode:
  {% set state = printer.print_stats.state %}
  {% if state == "complete" or state == "cancelled" %}
    BOX_UNLOAD
  {% endif %}


