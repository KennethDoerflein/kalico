[box]
box_count: 1 # Set to actual CFS count for faster startup.

[gcode_macro _START_PRINT_VARS]
# Heat Soak times (minutes)
variable_heat_soak: 12         # Default fallback soak time
variable_soak_pla: 12          # 12 min for PLA
variable_soak_petg: 5          # 5 min for PETG
variable_soak_asa: 30          # 30 min for ASA
variable_soak_abs: 30          # 30 min for ABS

# Z-Offsets per material (mm)
variable_offset_default: 0.00
variable_offset_asa: 0
variable_offset_abs: -0.02

# Pressure Advance per material
variable_pa_default: 0.038
variable_pa_pla: 0.026
variable_pa_petg: 0.040
variable_pa_abs: 0.035
variable_pa_asa: 0.035
variable_pa_tpu: 0.080

# Flow Multiplier (%) per material
variable_flow_default: 100
variable_flow_pla: 100
variable_flow_petg: 95
variable_flow_abs: 100
variable_flow_asa: 100

variable_adaptive_axis_twist_comp: 0 # Calibrate twist over the print area unless PRTouch is the probe. 0 disables.
variable_prtouch_scrub: 0 # Scrub the nozzle on the plate tab when PRTouch exists. 0 skips scrub only.
gcode:
